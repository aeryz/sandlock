name: Optional features

on:
  push:
    branches: [optional-core-features]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  feature:
    name: Rust features (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [minimal, checkpoint, image, default]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: features-${{ matrix.feature }}
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check minimal dependency graph
        if: matrix.feature == 'minimal'
        run: |
          if cargo tree --workspace --no-default-features -e normal --prefix none \
              | grep -E '^(bincode|tar|flate2|ruzstd|base64|hyper|rustls|rcgen|bollard) '; then
            exit 1
          fi
      - name: Test selected features
        timeout-minutes: 20
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          case "$FEATURE" in
            minimal) args=(--no-default-features) ;;
            default) args=() ;;
            *) args=(--no-default-features --features "$FEATURE") ;;
          esac
          cargo test --release --workspace "${args[@]}" --no-fail-fast -- --test-threads=1
